name: live-test
on:
  push:
    branches: [live-test]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Probe APIs directly
        run: |
          for u in "https://overpass-api.de/api/status" "https://geocoding-api.open-meteo.com/v1/search?name=North%20Bend&count=1" "https://api.open-meteo.com/v1/elevation?latitude=47.5&longitude=-121.7" "https://router.project-osrm.org/route/v1/driving/-122.2,47.6;-121.7,47.5?overview=false" "https://a.tile.opentopomap.org/12/659/1430.png"; do echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -m 20 "$u")"; done
      - name: Probe Overpass with a real query
        run: curl -s -m 60 -X POST --data-urlencode 'data=[out:json][timeout:30];(relation["route"~"^(hiking|foot|walking)$"](47.40,-121.90,47.60,-121.60););out tags 3;' https://overpass-api.de/api/interpreter | head -c 600; echo
      - name: CORS check for Overpass mirrors
        run: |
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do echo "$u $(curl -s -m 30 -o /dev/null -D - -H 'Origin: https://jixter86.github.io' --data-urlencode 'data=[out:json];node(1);out;' $u | grep -i -E '^HTTP|access-control-allow-origin' | tr -d '\r' | tr '\n' ' ')"; done
      - run: mkdir -p shots && node tests/dump.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
